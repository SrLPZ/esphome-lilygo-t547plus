esphome:
  name: epaper-display
  friendly_name: epaper-display
  
  platformio_options:
    upload_speed: 921600
    monitor_speed: 115200
    board_build.mcu: esp32s3
    board_build.f_cpu: 240000000L
    board_build.arduino.memory_type: qspi_opi
    board_build.flash_size: 4MB
    board_build.flash_mode: qio
    board_build.flash_type: qspi
    board_build.psram_type: opi
    board_build.memory_type: qspi_opi
    board_build.boot_freq: 80m
    build_flags:
      - "-DBOARD_HAS_PSRAM"
      - "-DARDUINO_USB_CDC_ON_BOOT=1"
      - "-mfix-esp32-psram-cache-issue"
  libraries:
    - SPI
    - Wire

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    sdkconfig_options:
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_ESP32S3_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_BOOT_INIT: "y"
      CONFIG_SPIRAM_IGNORE_NOTFOUND: "n"

# Enable logging
debug:
  update_interval: 5s

# Logger must be at least debug (default)
logger:
  level: debug

# Enable Home Assistant API (API password is deprecated in favor of encryption key)
# https://esphome.io/components/api.html
api:
  encryption:
    # key: YOUR_ENCRYPTION_KEY_HERE
  on_client_connected:
    then:
      - lambda: id(t5_display).scan_on();
      - component.update: t5_display
      - lambda: id(t5_display).scan_off();

ota:
  - platform: esphome
    id: my_ota
    # password: YOUR_PASSWORD_OTA_HERE

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  #fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Liligo-T5-47-Epaper-Plus"
    password: "12345678"

captive_portal:
  
uart:
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# i2c:
#   - id: bus_a
#     sda: GPIO18
#     scl: GPIO17
#     frequency: 100khz
#     # There is some problems with i2c scan so turn scan off if problem appear on your board
#     scan: False

external_components:
  - source: github://SrLPZ/esphome-lilygo-t547plus
    components: ["t547"]

font:
  - file: gfonts://Roboto Mono
    id: Hour
    size: 200
    glyphs: "+-0123456789.:"

  - file: gfonts://Roboto
    id: Date
    size: 50
    
time:
  # - platform: pcf8563
  #   id: internal_clock
  #   address: 0x51  
  #   i2c_id: bus_a

  - platform: homeassistant
    id: ntp
    on_time:
      # Every 1 minutes
      - seconds: 0
        minutes: /1
        then:
        - lambda: id(t5_display).scan_on();
        - component.update: t5_display
        - lambda: id(t5_display).scan_off();

binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO21
      inverted: true
    name: "Button 1"
    on_press:
      - logger.log: PhysButton Pressed
      - lambda: id(t5_display).scan_on();
      - component.update: t5_display
      - lambda: id(t5_display).scan_off();

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

display:
- platform: t547
  id: t5_display
  update_interval: never
  lambda: |-
      it.strftime(xCenter, 270, id(Hour), TextAlign::BASELINE_CENTER, "%H:%M", id(ntp).now());
      it.strftime(xCenter, 340, id(Date), TextAlign::BASELINE_CENTER, "%d-%m-%Y", id(ntp).now());
